<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="QuestionCam"><link rel="manifest" href="/manifest.webmanifest"><title>AutoQuestionCam</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f4f6fb;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:620px;margin:auto;padding:18px}h1{font-size:24px;margin:6px 0}p{color:#bac4d5;font-size:14px;line-height:1.5}.camera{position:relative;background:#05070b;border-radius:18px;overflow:hidden;aspect-ratio:3/4;max-height:65vh}video{width:100%;height:100%;object-fit:cover}.reticle{position:absolute;inset:16% 7%;border:2px solid #61d8b6;border-radius:14px;pointer-events:none}.panel{margin-top:16px;background:#202c3e;padding:18px;border-radius:16px}.answer{font-size:60px;font-weight:800;text-align:center;color:#6ee7b7}.status{min-height:24px;color:#d4dceb}button{border:0;background:#6ee7b7;color:#0b1a22;font-weight:700;border-radius:12px;padding:14px 18px;font-size:16px;flex:1}button:disabled{opacity:.45}.buttons{display:flex;gap:10px;margin-top:12px}.muted{font-size:12px;color:#aeb8ca}
</style></head><body><main><h1>AutoQuestionCam</h1><p>Hướng camera vào một câu trắc nghiệm A/B/C/D. AI tự quét định kỳ và chỉ hiển thị đáp án.</p><div class="camera"><video id="video" autoplay muted playsinline></video><div class="reticle"></div></div><div class="panel"><div class="muted">ĐÁP ÁN</div><div id="answer" class="answer">—</div><div id="status" class="status" role="status">Nhấn Bắt đầu để cấp quyền camera.</div><div class="buttons"><button id="start">Bắt đầu</button><button id="stop" disabled>Tạm dừng</button></div><p class="muted">Quét khoảng 4 giây/lần khi ảnh ổn định; không lưu video. Mỗi lần gửi ảnh đến AI có thể phát sinh chi phí API. Đáp án AI có thể sai.</p></div></main><script src="/app.js"></script></body></html>
